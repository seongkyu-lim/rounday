services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rounday
      MYSQL_USER: rounday
      MYSQL_PASSWORD: rounday
      MYSQL_ROOT_PASSWORD: rounday-root
    ports:
      - "13306:3306"
    volumes:
      - rounday-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -urounday -prounday --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rounday?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: rounday
      SPRING_DATASOURCE_PASSWORD: rounday
    ports:
      - "18080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  rounday-mysql:
